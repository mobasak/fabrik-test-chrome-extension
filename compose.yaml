# compose.yaml - Production-like Docker Compose
# Auto-generated by fabrik scaffold (_write_canonical_compose).
# Used by Coolify (git source) for first-deploy and by ``make docker-smoke``.
#
# B16/B18/B20-B22 invariants (do not regress):
#   - service name == project name (drives Traefik routing + ``docker ps``)
#   - hardcoded port in the loadbalancer label (no ${VAR:-...})
#   - Host(...) uses the literal FQDN (no shell-fallback placeholders)
#   - container joins the external ``coolify`` network for Traefik mesh
#
# See ``tests/test_scaffold_compose_traefik.py`` for the enforced contract.

services:
  fabrik-test-chrome-extension:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: fabrik-test-chrome-extension
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.fabrik-test-chrome-extension.rule=Host(`fabrik-test-chrome-extension.vps1.ocoron.com`)"
      - "traefik.http.routers.fabrik-test-chrome-extension.entrypoints=websecure"
      - "traefik.http.routers.fabrik-test-chrome-extension.tls=true"
      - "traefik.http.routers.fabrik-test-chrome-extension.tls.certresolver=letsencrypt"
      # B18: hardcoded port — Coolify's compose parser does not expand
      # ${VAR:-default} inside Traefik label strings, so a literal
      # ``${PORT:-8000}`` reaches Traefik as the port and 404s the
      # router. Edit alongside the healthcheck above if the app moves.
      - "traefik.http.services.fabrik-test-chrome-extension.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.fabrik-test-chrome-extension-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.fabrik-test-chrome-extension-cors.headers.accesscontrolalloworiginlist=chrome-extension://*"
      - "traefik.http.middlewares.fabrik-test-chrome-extension-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.fabrik-test-chrome-extension-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.routers.fabrik-test-chrome-extension.middlewares=fabrik-test-chrome-extension-cors"

networks:
  coolify:
    external: true
